apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: shikybox-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: web
      protocol: TCP
      port: 3000
      targetPort: web
      nodePort: 30030
