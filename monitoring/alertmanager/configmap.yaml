apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: shikybox-platform
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: shikybox-operations
      group_by:
        - alertname
        - severity
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 4h

      routes:
        - receiver: shikybox-critical
          matchers:
            - severity="critical"
          continue: false

        - receiver: shikybox-operations
          matchers:
            - severity="warning"
          continue: false

    receivers:
      - name: shikybox-operations

      - name: shikybox-critical

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal:
          - alertname
