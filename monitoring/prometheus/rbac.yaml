apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: shikybox-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shikybox-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: shikybox-platform
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shikybox-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: shikybox-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shikybox-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
