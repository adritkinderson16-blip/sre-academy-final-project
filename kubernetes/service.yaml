apiVersion: v1
kind: Service
metadata:
  name: shikybox
  namespace: shikybox
  labels:
    app.kubernetes.io/name: shikybox
    app.kubernetes.io/component: storefront
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: shikybox
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: 30080
