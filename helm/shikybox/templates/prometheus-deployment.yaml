{{- if .Values.prometheus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: shikybox-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: shikybox-platform
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: {{ .Values.prometheus.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: {{ .Values.prometheus.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.prometheus.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.prometheus.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.prometheus.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: {{ .Values.prometheus.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.prometheus.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.prometheus.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.prometheus.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.prometheus.resources | indent 12 }}
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-alert-rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-alert-rules
          configMap:
            name: prometheus-alert-rules
        - name: prometheus-data
{{- if .Values.prometheus.storage.enabled }}
          persistentVolumeClaim:
            claimName: prometheus-data
{{- else }}
          emptyDir: {}
{{- end }}
{{- end }}
