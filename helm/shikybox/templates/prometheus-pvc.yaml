{{- if and .Values.prometheus.enabled .Values.prometheus.storage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: shikybox-platform
spec:
  accessModes:
    - {{ .Values.prometheus.storage.accessMode }}
  resources:
    requests:
      storage: {{ .Values.prometheus.storage.size }}
{{- end }}
