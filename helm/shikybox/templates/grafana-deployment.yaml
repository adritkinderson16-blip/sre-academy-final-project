{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: shikybox-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: shikybox-platform
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: web
              containerPort: {{ .Values.grafana.service.port }}
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.admin.user | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.admin.password | quote }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: {{ .Values.grafana.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.grafana.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.grafana.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.grafana.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: {{ .Values.grafana.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.grafana.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.grafana.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.grafana.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.grafana.resources | indent 12 }}
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: shikybox-dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: grafana-data
{{- if .Values.grafana.storage.enabled }}
          persistentVolumeClaim:
            claimName: grafana-data
{{- else }}
          emptyDir: {}
{{- end }}
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: shikybox-dashboard
          configMap:
            name: grafana-shikybox-dashboard
{{- end }}
