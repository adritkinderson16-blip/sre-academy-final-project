{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-shikybox-dashboard
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: shikybox-platform
data:
  shikybox-dashboard.json: |
{{ .Files.Get "files/grafana/shikybox-dashboard.json" | indent 4 }}
{{- end }}
