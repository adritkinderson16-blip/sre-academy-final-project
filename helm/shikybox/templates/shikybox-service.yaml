apiVersion: v1
kind: Service
metadata:
  name: {{ include "shikybox.fullname" . }}
  namespace: {{ .Values.namespaces.application }}
  labels:
    {{- include "shikybox.labels" . | nindent 4 }}
    app.kubernetes.io/component: storefront
spec:
  type: {{ .Values.shikybox.service.type }}
  selector:
    {{- include "shikybox.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.shikybox.service.port }}
      targetPort: http
      {{- if and (eq .Values.shikybox.service.type "NodePort") .Values.shikybox.service.nodePort }}
      nodePort: {{ .Values.shikybox.service.nodePort }}
      {{- end }}
