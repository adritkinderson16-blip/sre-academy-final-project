{{- if .Values.alertmanager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: shikybox-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: shikybox-platform
    spec:
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: web
              containerPort: {{ .Values.alertmanager.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
              readOnly: true
          {{- if .Values.alertmanager.email.enabled }}
            - name: alertmanager-email-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true
          {{- end }}
            - name: alertmanager-data
              mountPath: /alertmanager
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
      {{- if .Values.alertmanager.email.enabled }}
        - name: alertmanager-email-secret
          secret:
            secretName: {{ .Values.alertmanager.email.existingSecret }}
            items:
              - key: {{ .Values.alertmanager.email.secretKey }}
                path: smtp-password
      {{- end }}
        - name: alertmanager-data
      {{- if .Values.alertmanager.storage.enabled }}
          persistentVolumeClaim:
            claimName: alertmanager-data
      {{- else }}
          emptyDir: {}
      {{- end }}
{{- end }}