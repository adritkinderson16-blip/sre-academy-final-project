namespaces:
  application: shikybox
  monitoring: monitoring

shikybox:
  replicaCount: 3

  image:
    repository: shikybox
    tag: "1.0.0"
    pullPolicy: Never

  application:
    version: "1.0.0"
    environment: kubernetes

  service:
    type: NodePort
    port: 8080
    nodePort: 30080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  probes:
    readiness:
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

prometheus:
  enabled: true

  image:
    repository: prom/prometheus
    tag: "v3.5.0"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 9090
    nodePort: 30090

  storage:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce

  retention: 7d
  scrapeInterval: 15s
  evaluationInterval: 15s

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

grafana:
  enabled: true

  image:
    repository: grafana/grafana
    tag: "12.1.0"
    pullPolicy: IfNotPresent

  admin:
    user: admin
    password: admin

  service:
    type: NodePort
    port: 3000
    nodePort: 30030

  storage:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

alertmanager:
  enabled: true

  image:
    repository: prom/alertmanager
    tag: "v0.28.1"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 9093
    nodePort: 30093

  storage:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce

  email:
    enabled: true
    existingSecret: shikybox-email
    secretKey: smtp-password

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3